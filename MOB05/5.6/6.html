<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="number" placeholder="reais">
    <select id="moeda">
        <option value="dolar">Dólar</option>
        <option value="euro">Euro</option>
        <option value="peso">Peso</option>
    </select>
    <button onclick="converter()">Converter</button>
    <p id="resultado"></p>
</body>
<script>
    function converter() {
        let reais = parseFloat(document.querySelector('input').value);
        let moeda = document.getElementById('moeda').value;
        let resultado;

        if (moeda === 'dolar') {
            resultado = reais / 5.0; 
        } else if (moeda === 'euro') {
            resultado = reais / 6.0; 
            resultado = reais / 6.0; 
        } else if (moeda === 'peso') {
            resultado = reais / 0.05;
        }

        document.getElementById('resultado').textContent = `Resultado: ${resultado.toFixed(2)} ${moeda}`;
    }
</script>
</body>
</html>
